# Patch fork: pull in new releases from paulmassen/seo-playground every day.
# Railway redeploys automatically when main changes. If our changes conflict with upstream
# (or upstream edits a workflow file), this run fails and GitHub emails the repo owner;
# resolve it with the "Sync fork" button on the repo page.
name: Sync upstream

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge upstream main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/paulmassen/seo-playground.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date."
            exit 0
          fi
          git merge --no-edit upstream/main
          git push origin HEAD:main
